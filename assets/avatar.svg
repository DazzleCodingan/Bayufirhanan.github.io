<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f24" />
      <stop offset="50%" stop-color="#050a1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e4ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="90" cy="90" r="90" fill="#a855f7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="310" cy="310" r="100" fill="#00d2ff" opacity="0.18" filter="url(#glow)"/>

  <!-- Tech Grid Lines -->
  <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M0 300 H400 M0 350 H400" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Cyber Hexagon Shield Frame -->
  <polygon points="200,60 310,120 310,240 200,300 90,240 90,120" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.85"/>
  <circle cx="200" cy="180" r="85" fill="#080f24" stroke="url(#purpleGrad)" stroke-width="2"/>

  <!-- Stylish Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="42" fill="#0f1b3b" stroke="#00d2ff" stroke-width="1.5"/>
  <!-- Glasses / Cyber Visor -->
  <path d="M175 155 Q200 162 225 155" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Body / Shoulders -->
  <path d="M135 245 C135 195, 265 195, 265 245 Z" fill="#0f1b3b" stroke="#00d2ff" stroke-width="1.5"/>

  <!-- Glowing Accent Badges -->
  <circle cx="200" cy="285" r="5" fill="#00d2ff" filter="url(#glow)"/>
  <text x="200" y="345" font-family="'Space Mono', monospace" font-size="14" fill="#00d2ff" font-weight="bold" letter-spacing="3" text-anchor="middle">BAYU / DAZZLE</text>
  <text x="200" y="365" font-family="'Outfit', sans-serif" font-size="11" fill="#c084fc" letter-spacing="1" text-anchor="middle">Foto profil bisa diganti nanti</text>
</svg>
