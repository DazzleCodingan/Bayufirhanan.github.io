<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="70%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <rect width="400" height="400" fill="url(#avatarBg)"/>

  <!-- Ambient Minimal Tech Circles -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>

  <!-- Financial Chart Nodes Background Silhouette -->
  <path d="M70 240 L130 200 L180 220 L240 160 L300 170 L340 130" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="240" cy="160" r="4" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="340" cy="130" r="4" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- Minimal Silhouette Figure -->
  <!-- Shoulders / Torso -->
  <path d="M110 360 C110 270, 140 240, 200 240 C260 240, 290 270, 290 360 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <!-- Collar / Inner Vest -->
  <path d="M175 242 L200 280 L225 242 Z" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <!-- Neck -->
  <rect x="186" y="200" width="28" height="45" rx="6" fill="#27272a"/>
  
  <!-- Head Silhouette -->
  <ellipse cx="200" cy="165" rx="46" ry="54" fill="#1c1c1f" stroke="#52525b" stroke-width="1.5"/>

  <!-- Modern Hairline -->
  <path d="M154 160 C154 125, 175 112, 200 112 C230 112, 248 128, 246 155 C238 145, 225 140, 200 142 C178 144, 165 152, 154 160 Z" fill="#27272a"/>

  <!-- Minimalist Specs / Glasses (Sleek Data Analyst / Trader Style) -->
  <rect x="162" y="156" width="30" height="18" rx="5" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)"/>
  <rect x="208" y="156" width="30" height="18" rx="5" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)"/>
  <line x1="192" y1="164" x2="208" y2="164" stroke="#ffffff" stroke-width="2"/>
  <line x1="152" y1="162" x2="162" y2="162" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="238" y1="162" x2="248" y2="162" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- Badge Pill at Bottom -->
  <g transform="translate(110, 345)">
    <rect width="180" height="34" rx="17" fill="#121212" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#22c55e" filter="url(#softGlow)"/>
    <text x="35" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ececec" letter-spacing="1.5">BAYU FIRHANAN</text>
  </g>
</svg>
